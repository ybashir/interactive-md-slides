services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: interdeck
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interdeck"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - interdeck-postgres:/var/lib/postgresql/data

volumes:
  interdeck-postgres:
