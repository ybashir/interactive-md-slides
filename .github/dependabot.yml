version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait before proposing freshly published versions so compromised
    # releases (npm worm/maintainer-takeover incidents) are usually yanked
    # before they reach a PR. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /services/app
    schedule:
      interval: weekly
    # Wait before proposing freshly published versions so compromised
    # releases (npm worm/maintainer-takeover incidents) are usually yanked
    # before they reach a PR. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait before proposing freshly published versions so compromised
    # releases (npm worm/maintainer-takeover incidents) are usually yanked
    # before they reach a PR. Security updates are not delayed.
    cooldown:
      default-days: 7
